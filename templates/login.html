{% extends 'base.html' %}

{% block title %}Login | Pomodoro{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-logo"><span class="brand-mark">🍅</span> Pomodoro</div>
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Log in to continue your focus journey</p>

        <form class="auth-form" action="#" method="post">
            {% csrf_token %}
            <label>
                <span>Email</span>
                <input type="email" name="email" placeholder="you@example.com">
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="Enter your password">
            </label>
            <button class="primary-button" type="submit">Log In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
    </div>
</section>
{% endblock %}
