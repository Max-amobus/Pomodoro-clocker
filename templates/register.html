{% extends 'base.html' %}

{% block title %}Register | Pomodoro{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <div class="auth-logo"><span class="brand-mark">🍅</span> Pomodoro</div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Start your productivity journey today</p>

        <form class="auth-form" action="#" method="post">
            {% csrf_token %}
            <label>
                <span>Username</span>
                <input type="text" name="username" placeholder="Your username">
            </label>
            <label>
                <span>Email</span>
                <input type="email" name="email" placeholder="you@example.com">
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="Create a password">
            </label>
            <button class="primary-button" type="submit">Sign Up</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</section>
{% endblock %}
